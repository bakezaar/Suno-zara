<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Suno Zara News Article"
        id="articleDescription"
    >

    <meta
        name="theme-color"
        content="#101A2B"
    >

    <title>
        Article — Suno Zara
    </title>

    <link
        rel="icon"
        type="image/jpeg"
        href="images/logo.jpeg"
    >

    <link
        rel="apple-touch-icon"
        href="images/logo.jpeg"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<header class="site-header">

    <div class="header-inner">

        <a
            href="index.html"
            class="brand"
            aria-label="Suno Zara Home"
        >
            <img
                src="images/logo.jpeg"
                alt="Suno Zara logo"
                class="brand-logo"
            >
        </a>

        <button
            class="mobile-menu-button"
            id="mobileMenuButton"
            type="button"
            aria-label="Open navigation"
            aria-expanded="false"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav
            class="main-navigation"
            id="mainNavigation"
            aria-label="Main navigation"
        >

            <a href="index.html" class="nav-link">
                Home
            </a>

            <a href="programs.html" class="nav-link">
                Programs
            </a>

            <a
                href="news.html"
                class="nav-link active"
            >
                News
            </a>

            <a href="about.html" class="nav-link">
                About
            </a>

            <a
                href="index.html#live"
                class="listen-button"
            >
                <span class="listen-dot"></span>
                Listen Live
            </a>

        </nav>

    </div>

</header>


<main>

    <article class="article-page">

        <div class="section-container">

            <a
                href="news.html"
                class="back-link"
            >
                ← Back to News
            </a>


            <div
                class="article-category"
                id="articleCategory"
            >
                NEWS
            </div>


            <h1
                class="article-title"
                id="articleTitle"
            >
                Loading story...
            </h1>


            <div class="article-meta">

                <span id="articleDate">
                    —
                </span>

                <span class="article-meta-divider">
                    /
                </span>

                <span id="articleAuthor">
                    Suno Zara Newsroom
                </span>

            </div>


            <div
                class="article-lead"
                id="articleLead"
            >
            </div>


            <div
                class="article-visual"
                id="articleVisual"
            >

                <div class="article-visual-label">
                    SUNO ZARA
                </div>

                <div class="article-visual-wave">

                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </div>


            <div
                class="article-body"
                id="articleBody"
            >
            </div>


            <div class="article-footer">

                <a
                    href="news.html"
                    class="primary-button"
                >
                    More News
                </a>

                <a
                    href="index.html#live"
                    class="secondary-button dark"
                >
                    Listen Live
                </a>

            </div>

        </div>

    </article>

</main>


<footer class="site-footer">

    <div class="footer-inner">

        <div class="footer-brand">

            <img
                src="images/logo.jpeg"
                alt="Suno Zara"
            >

            <p>
                Awaazon Ke Darmiyan.
            </p>

        </div>

        <div class="footer-links">

            <div>

                <span class="footer-heading">
                    Explore
                </span>

                <a href="index.html">
                    Home
                </a>

                <a href="programs.html">
                    Programs
                </a>

                <a href="news.html">
                    News
                </a>

                <a href="about.html">
                    About
                </a>

            </div>

            <div>

                <span class="footer-heading">
                    Suno Zara
                </span>

                <span>
                    Student Web Radio
                </span>

                <span>
                    GCU Lahore
                </span>

                <span>
                    Awaazon Ke Darmiyan
                </span>

            </div>

        </div>

    </div>

    <div class="footer-bottom">

        <span>
            © <span id="currentYear"></span> Suno Zara
        </span>

        <span>
            Broadcast Journalism Project
        </span>

    </div>

</footer>


<script src="js/config.js"></script>
<script src="js/script.js"></script>

</body>
</html>
